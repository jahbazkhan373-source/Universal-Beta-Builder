name: Generate Signing Key - Universal Beta Builder

on:
  workflow_dispatch:
    inputs:
      STORE_PASSWORD:
        description: 'Store Password likho, yaad rakhna'
        required: true
        default: 'Beta1234'
      KEY_PASSWORD:
        description: 'Key Password likho'
        required: true
        default: 'Beta1234'

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore - Universal Beta Builder
        run: |
          keytool -genkeypair -v \
            -keystore universal-beta-release.keystore \
            -alias universal-beta-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ inputs.STORE_PASSWORD }} \
            -keypass ${{ inputs.KEY_PASSWORD }} \
            -dname "CN=Universal Beta Builder, OU=Beta, O=Universal Beta App, L=Faisalabad, ST=Punjab, C=PK"

      - name: Show Base64 - Isko Copy Karna Hai
        run: |
          echo "====== BASE64 START ======"
          base64 -w 0 universal-beta-release.keystore
          echo ""
          echo "====== BASE64 END ======"

      - name: Upload Keystore File
        uses: actions/upload-artifact@v4
        with:
          name: universal-beta-release-keystore
          path: universal-beta-release.keystore