function matchVoiceDisplay(rawName, fallback)
    local target = tostring(rawName or "")
    local cleanTarget = target:match("^(%w+)") or target
    for _, v in ipairs(ALL_VOICES) do
        if v == target or v:match("^(%w+)") == cleanTarget then
            return v
        end
    end
    return fallback
end

