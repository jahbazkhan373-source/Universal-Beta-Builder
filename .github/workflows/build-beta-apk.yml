    editor.putString("tone", selectedTone)
    editor.putString("model", selectedModel)
    editor.putString("narrator", selectedNarrator)
    editor.putBoolean("storyMode", isStoryMode)
    editor.putBoolean("broadcastMode", isBroadcastMode)
    editor.putInt("broadcastSpeakerCount", broadcastSpeakerCount)
    for i = 1, 6 do
        editor.putString("broadcastVoice_" .. i, broadcastVoices[i])
    end
    editor.putString("broadcastMood", selectedBroadcastMood)
    editor.putString("scriptDuration", selectedDuration)
    editor.putString("customMinutes", customMinutesStr)
    for i = 1, 10 do
        local cleanKey = tostring(apiKeys[i] or ""):match("^%s*(.-)%s*$")
        apiKeys[i] = cleanKey
        editor.putString("apikey_" .. i, encodeSecret(cleanKey))
    end
    editor.putString("filename", userFileName)
    editor.putInt("fileCounter", fileCounter)
    editor.apply()
end

function loadSettings()
    loadErrorLogs()
    selectedVoice = matchVoiceDisplay(prefs.getString("voice", "Puck (Male)"), "Puck (Male)")

    local savedTone = prefs.getString("tone", "Default")
    local matchedTone = nil
    for _, t in ipairs(ALL_TONES) do
        if t == savedTone then matchedTone = t break end
    end
    selectedTone = matchedTone or "Default"

    selectedModel = prefs.getString("model", TTS_MODELS[1])
    selectedNarrator = prefs.getString("narrator", NARRATOR_VOICES[1])
    isStoryMode = prefs.getBoolean("storyMode", false)
    isBroadcastMode = prefs.getBoolean("broadcastMode", false)
    if isStoryMode and isBroadcastMode then isBroadcastMode = false end

    broadcastSpeakerCount = prefs.getInt("broadcastSpeakerCount", 2)
    if broadcastSpeakerCount < 2 or broadcastSpeakerCount > 6 then broadcastSpeakerCount = 2 end
    local defaultBVoices = {"Puck (Male)", "Kore (Female)", "Charon (Male)", "Zephyr (Female)", "Fenrir (Male)", "Leda (Female)"}
    for i = 1, 6 do
        broadcastVoices[i] = matchVoiceDisplay(prefs.getString("broadcastVoice_" .. i, defaultBVoices[i]), defaultBVoices[i])
    end

    local savedMood = prefs.getString("broadcastMood", BROADCAST_MOODS[1])
    local matchedMood = nil
    for _, m in ipairs(BROADCAST_MOODS) do
        if m == savedMood then matchedMood = m break end
    end
    selectedBroadcastMood = matchedMood or BROADCAST_MOODS[1]

    selectedDuration = prefs.getString("scriptDuration", "10 Minutes")
    customMinutesStr = prefs.getString("customMinutes", "10")

    for i = 1, 10 do
        local rawKey = prefs.getString("apikey_" .. i, "")
        apiKeys[i] = decodeSecret(rawKey):match("^%s*(.-)%s*$")
    end
    userFileName = prefs.getString("filename", "")
    fileCounter = prefs.getInt("fileCounter", 0)
end

function getDefaultFileName(modeName)
    fileCounter = fileCounter + 1
    saveSettings()
    local prefix = "Single"
    if modeName == "broadcast" then
        prefix = "Broadcast"
    elseif modeName == "story" then
        prefix = "Story"
    end
    return prefix .. "_Jahbaz_" .. string.format("%03d", fileCounter)
end

