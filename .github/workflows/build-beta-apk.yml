        if mainMediaPlayer == nil then
            initMainMediaPlayer()
            pcall(function()
                mainMediaPlayer.setDataSource(generatedAudioPath)
                mainMediaPlayer.prepare()
                mainMediaPlayer.setOnCompletionListener(MediaPlayer.OnCompletionListener{
                    onCompletion = function(mp)
                        isMainPlaying = false
                        runOnUi(function() views.playBtn.setText("PLAY") end)
                    end
                })
            end)
        end
        toggleMainPlayPause(views.playBtn)
    end

    views.shareBtn.onClick = function()
        if not generatedAudioPath then showToast("No audio to share") return end
        shareAudioFile(generatedAudioPath)
    end

    views.downloadBtn.onClick = function()
        if not generatedAudioPath then showToast("No audio found") return end
        local fObj = File(generatedAudioPath)
        local outName = fObj.exists() and fObj.getName() or ((userFileName ~= "" and userFileName or getDefaultFileName(getActiveModeName())) .. ".wav")
        local okSave, msg = saveFileToDownloads(generatedAudioPath, outName)
        if okSave then
            showToast("Downloaded to Mobile Storage: " .. outName)
        else
            showToast("Failed to Download: " .. tostring(msg))
        end
    end

    views.generateBtn.onClick = function()
        local currentText = views.textInput.getText().toString()
        if currentText:match("^%s*$") then
            showToast("Please enter text first!")
            return
        end
        if not getWorkingApiKey() then
            showToast("Please configure API Key first!")
            showApiSettings()
            return
        end
        if String(currentText).length() > MAX_TOTAL_CHARS then
            showToast("Text exceeds " .. MAX_TOTAL_CHARS .. " characters limit!")
            return
        end
        if not isNetworkAvailable() then
            showToast("No internet connection!")
            showErrorDialog("Please turn on Wi-Fi or Mobile Data to generate audio.")
            return
        end

        userText = currentText
        if mainMediaPlayer ~= nil then
            pcall(function() if isMainPlaying then mainMediaPlayer.stop() end end)
            isMainPlaying = false
            pcall(function() mainMediaPlayer.release() end)
            mainMediaPlayer = nil
        end

        views.playBtn.setEnabled(false)
        views.playBtn.setText("PLAY")
        views.resultLayout.setVisibility(View.GONE)
        views.resumeBtn.setVisibility(View.GONE)
        views.generateBtn.setEnabled(false)
        views.generateBtn.setText("GENERATING AUDIO (0%)...")
        views.generateBtn.setBackgroundColor(Color.parseColor("#9E9E9E"))
        views.stopBtn.setEnabled(true)

        generateFullAudio(userText, getActiveModeName(), nil, views)
    end

    views.resumeBtn.onClick = function()
        if not resumeState then
            resumeState = findLatestResumeState()
        end
        if not resumeState then showToast("Nothing to resume") return end
        startResumeFromLibrary(resumeState, views)
    end

    views.stopBtn.onClick = function()
        if cancellationRequested then return end
        cancellationRequested = true
        currentGenerationId = currentGenerationId + 1
        pcall(function()
            if activeHttpRequest and activeHttpRequest.cancel then
                activeHttpRequest.cancel(true)
            end
        end)
        views.statusText.setText("Stopping... saving progress...")
        showToast("Stopping...")
        views.generateBtn.setEnabled(true)
        views.generateBtn.setText("GENERATE AUDIO")
        views.generateBtn.setBackgroundColor(Color.parseColor("#2196F3"))
        views.createScriptBtn.setEnabled(true)
        views.createScriptBtn.setText("CREATE SCRIPT")
        views.createStoryBtn.setEnabled(true)
        views.createStoryBtn.setText("CREATE STORY")
        views.stopBtn.setEnabled(false)
    end

    views.apiBtn.onClick = function() showApiSettings() end
    views.optBtn.onClick = function() showMoreOptions() end
end

function onDestroy()
    cancellationRequested = true
    currentGenerationId = currentGenerationId + 1
    setKeepAwake(false)
    stopLibTimer()
    pcall(function()
        if mainMediaPlayer then
            if isMainPlaying then mainMediaPlayer.stop() end
            mainMediaPlayer.release()
            mainMediaPlayer = nil
        end
    end)
    pcall(function()
        if libMediaPlayer then
            libMediaPlayer.stop()
            libMediaPlayer.release()
            libMediaPlayer = nil
        end
    end)
end

showMain()
