function isNetworkAvailable()
    local connected = true
    pcall(function()
        local cm = context.getSystemService(Context.CONNECTIVITY_SERVICE)
        if cm then
            local netInfo = cm.getActiveNetworkInfo()
            connected = (netInfo ~= nil and netInfo.isConnected())
