function checkAndRequestPermissionsOnce()
    if Build.VERSION.SDK_INT >= 23 then
        local hasAsked = prefs.getBoolean("has_asked_permission", false)
        if not hasAsked then
            local permsToAsk = {}
            if Build.VERSION.SDK_INT >= 33 then
                if activity.checkSelfPermission("android.permission.READ_MEDIA_AUDIO") ~= 0 then
                    table.insert(permsToAsk, "android.permission.READ_MEDIA_AUDIO")
                end
            else
                if activity.checkSelfPermission("android.permission.WRITE_EXTERNAL_STORAGE") ~= 0 then
                    table.insert(permsToAsk, "android.permission.WRITE_EXTERNAL_STORAGE")
                end
                if activity.checkSelfPermission("android.permission.READ_EXTERNAL_STORAGE") ~= 0 then
                    table.insert(permsToAsk, "android.permission.READ_EXTERNAL_STORAGE")
                end
            end
            if #permsToAsk > 0 then
                pcall(function()
                    activity.requestPermissions(permsToAsk, 1)
                end)
            end
            local ed = prefs.edit()
            ed.putBoolean("has_asked_permission", true)
            ed.apply()
        end
    end
end

checkAndRequestPermissionsOnce()

