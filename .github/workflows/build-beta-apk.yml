function openReportIssueDialog()
    local scroll = ScrollView(context)
    local layout = LinearLayout(context)
    layout.setOrientation(1)
    layout.setPadding(35, 35, 35, 35)

    local title = TextView(context)
    title.setText("Report Issue / Error Log")
    title.setTextSize(18)
    title.setGravity(Gravity.CENTER)
    title.setTextColor(0xFFD32F2F)
    title.setTypeface(Typeface.DEFAULT_BOLD)
    title.setPadding(0, 0, 0, 20)
    layout.addView(title)

    local logView = TextView(context)
    logView.setTextSize(12)
    logView.setTextColor(0xFF222222)
    logView.setBackgroundColor(0xFFF5F5F5)
    logView.setPadding(20, 20, 20, 20)
    local function getReportText()
        if #errorLogs == 0 then
            return "No errors or issues recorded yet. Everything is working smoothly."
        end
        return table.concat(errorLogs, "\n\n")
    end
    logView.setText(getReportText())
    layout.addView(logView)

    local function makeBtn(label, bgHex)
        local b = Button(context)
        b.setText(label)
        b.setBackgroundColor(Color.parseColor(bgHex))
        b.setTextColor(Color.WHITE)
        local p = LinearLayout.LayoutParams(-1, -2)
        p.topMargin = 12
        b.setLayoutParams(p)
        return b
    end

    local btnCopy = makeBtn("COPY REPORT", "#2196F3")
    local btnWa = makeBtn("SEND ON WHATSAPP", "#25D366")
    local btnClear = makeBtn("CLEAR LOG", "#FF9800")
    local btnBack = makeBtn("GO BACK", "#9E9E9E")

    layout.addView(btnCopy)
    layout.addView(btnWa)
    layout.addView(btnClear)
    layout.addView(btnBack)

    scroll.addView(layout)
    local dlg = createOverlayDialog(scroll)
    dlg.show()

    btnCopy.setOnClickListener(function()
        pcall(function()
