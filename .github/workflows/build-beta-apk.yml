function showApiSettings()
    local views = {}
    local layout = { ScrollView, layout_width="fill", layout_height="fill", { LinearLayout, orientation="vertical", padding="15dp", layout_width="fill", layout_height="wrap", { TextView, text="10 API KEYS SETUP", textSize=16, textColor="#2196F3", gravity="center", paddingBottom="10dp", typeface=Typeface.DEFAULT_BOLD } } }
    local keysLayout = layout[2]
    
    for i = 1, 10 do
        table.insert(keysLayout, {TextView, text="API Key " .. i .. ":", textSize=11, paddingBottom="2dp", paddingTop="3dp"})
        table.insert(keysLayout, {
            LinearLayout, orientation="horizontal", layout_width="fill", layout_marginBottom="2dp",
            {EditText, id="apiKey"..i, text=apiKeys[i], hint="Enter Key "..i, layout_weight="1", backgroundColor="#F5F5F5", padding="8dp", textSize=12},
            {Button, id="testBtn"..i, text="TEST", backgroundColor="#FF9800", textColor="#FFFFFF", padding="8dp", textSize=11, layout_marginLeft="5dp"}
        })
    end
    table.insert(keysLayout, { LinearLayout, orientation="horizontal", layout_width="fill", layout_marginTop="10dp", {Button, id="saveBtn", text="SAVE ALL", layout_weight="1", backgroundColor="#4CAF50", textColor="#FFFFFF", padding="10dp"}, {Button, id="closeBtn", text="CLOSE", layout_weight="1", backgroundColor="#9E9E9E", textColor="#FFFFFF", padding="10dp", layout_marginLeft="10dp"} })
    
    local dlg = LuaDialog(activity) 
    dlg.setTitle("API Configuration") 
    dlg.setView(loadlayout(layout, views))
    
    for i = 1, 10 do
        views["testBtn"..i].onClick = function()
            local key = views["apiKey"..i].getText().toString():match("^%s*(.-)%s*$")
            if key == "" then showToast("Please enter API key "..i.." first") return end
            if not isNetworkAvailable() then showToast("No internet connection") return end
            
            local testUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts?key=" .. URLEncoder.encode(key, "UTF-8")
            
            local pd = ProgressDialog(context)
            pd.setMessage("Testing Key " .. i .. "...")
            pd.setCancelable(false)
            pd.show()
            
            Http.get(testUrl, function(code, content)
                runOnUi(function()
                    pcall(function() pd.dismiss() end)
                    local numCode = tonumber(code) or -1
                    if numCode == 200 then
                        showSuccessDialog(nil, "Key " .. i .. " is Valid! Ready for Gemini TTS.")
                    elseif numCode == 429 then
                        showErrorDialog("Key " .. i .. " is valid, but Rate Limit/Quota reached (429).")
                    elseif numCode == 400 or numCode == 401 or numCode == 403 then
                        local reason = "Invalid or unauthorized API key"
                        local okErr, errObj = pcall(cjson.decode, content)
                        if okErr and errObj and errObj.error and errObj.error.message then
                            reason = sanitizeErrorText(errObj.error.message)
                        end
                        showErrorDialog("Key " .. i .. " Failed (Code " .. tostring(numCode) .. "): " .. reason)
                    else
                        showErrorDialog("Key " .. i .. " test failed (Code: " .. tostring(numCode) .. "). Check internet connection.")
                    end
                end)
            end)
        end
    end
    
    views.saveBtn.onClick = function()
        for i = 1, 10 do
            apiKeys[i] = views["apiKey"..i].getText().toString():match("^%s*(.-)%s*$")
        end
        saveSettings()
        showToast("Keys Saved!")
        dlg.dismiss()
    end
    views.closeBtn.onClick = function() dlg.dismiss() end
    dlg.show()
end

function getActiveModeName()
    if isBroadcastMode then return "broadcast"
    elseif isStoryMode then return "story"
    else return "single" end
end

function setSpinnerHelper(spinner, list, selectedItem, onChange)
    local adapter = ArrayAdapter(context, android.R.layout.simple_spinner_item, list)
    adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
    spinner.setAdapter(adapter)
    for i, v in ipairs(list) do
        if v == selectedItem then
            spinner.setSelection(i - 1)
            break
        end
    end
    spinner.onItemSelectedListener = {
        onItemSelected = function(p, v, pos)
            onChange(list[pos + 1], pos + 1)
        end
    }
end

function updateModeVisibility(views)
    views.singleModeLayout.setVisibility((not isStoryMode and not isBroadcastMode) and View.VISIBLE or View.GONE)
    views.storyModeLayout.setVisibility(isStoryMode and View.VISIBLE or View.GONE)
    views.broadcastModeLayout.setVisibility(isBroadcastMode and View.VISIBLE or View.GONE)
    if isBroadcastMode then
        views.modeStatusText.setText("Broadcast Studio Active (" .. broadcastSpeakerCount .. " Hosts)")
        views.textInput.setHint("Enter topic to CREATE SCRIPT, or paste script to GENERATE AUDIO... Max " .. MAX_TOTAL_CHARS .. " chars")
    elseif isStoryMode then
        views.modeStatusText.setText("Story Mode Active")
        views.textInput.setHint("Paste story to CREATE STORY or tagged story to GENERATE AUDIO... Max " .. MAX_TOTAL_CHARS .. " chars")
    else
        views.modeStatusText.setText("Single Voice Active")
        views.textInput.setHint("Type text here... Max " .. MAX_TOTAL_CHARS .. " chars")
    end
end

function updateBroadcastSpeakerRows(views)
    for i = 1, 6 do
        local row = views["spkRow" .. i]
        if row then
            row.setVisibility(i <= broadcastSpeakerCount and View.VISIBLE or View.GONE)
        end
    end
    if isBroadcastMode then
        views.modeStatusText.setText("Broadcast Studio Active (" .. broadcastSpeakerCount .. " Hosts)")
    end
end

