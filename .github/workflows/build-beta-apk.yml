end

function setKeepAwake(keepAwake)
    pcall(function()
        if wakeLock then
            if keepAwake then
                if not wakeLock.isHeld() then wakeLock.acquire() end
            else
                if wakeLock.isHeld() then wakeLock.release() end
            end
        end
    end)
end

function encodeSecret(str)
    if not str or str == "" then return "" end
    local ok, res = pcall(function()
        return Base64.encodeToString(String(str).getBytes("UTF-8"), Base64.NO_WRAP)
    end)
    return ok and ("ENC:" .. tostring(res)) or str
end

function decodeSecret(str)
    if not str or str == "" then return "" end
    if str:sub(1, 4) == "ENC:" then
        local encoded = str:sub(5)
        local ok, res = pcall(function()
            local bytes = Base64.decode(encoded, Base64.NO_WRAP)
            return tostring(String(bytes, "UTF-8"))
        end)
        if ok and res then return res end
    end
    return str
end

function sanitizeErrorText(errText)
    local clean = tostring(errText or "Unknown Error")
    for i = 1, 10 do
        local k = apiKeys[i]
        if k and #k > 5 then
            clean = clean:gsub(k:gsub("([%^%$%(%)%%%.%[%]%*%+%-%?])", "%%%1"), "[HIDDEN_KEY]")
        end
    end
    return clean
end

function saveErrorLogs()
    local editor = prefs.edit()
    local ok, encoded = pcall(cjson.encode, errorLogs)
    if ok and encoded then
        editor.putString("error_logs", encoded)
        editor.apply()
    end
end

function loadErrorLogs()
    local raw = prefs.getString("error_logs", "[]")
    local ok, decoded = pcall(cjson.decode, raw)
    if ok and type(decoded) == "table" then
        errorLogs = decoded
    else
        errorLogs = {}
    end
end

function logAppError(source, msg)
    local cleanMsg = sanitizeErrorText(msg)
    local entry = "[" .. os.date("%Y-%m-%d %H:%M:%S") .. "] [" .. tostring(source) .. "] " .. cleanMsg
    table.insert(errorLogs, entry)
    if #errorLogs > 50 then
        table.remove(errorLogs, 1)
    end
    saveErrorLogs()
end

function writeTextFile(path, str)
    local fos = nil
    local ok = pcall(function()
        fos = FileOutputStream(File(path))
        fos.write(String(str).getBytes("UTF-8"))
        fos.flush()
    end)
    pcall(function() if fos then fos.close() end end)
    return ok
end

function readTextFile(path)
    local f = File(path)
    if not f.exists() then return nil end
    local fis = nil
    local ok, res = pcall(function()
        fis = FileInputStream(f)
        local len = f.length()
        local buf = byte[len]
        fis.read(buf)
        return tostring(String(buf, "UTF-8"))
    end)
    pcall(function() if fis then fis.close() end end)
    return ok and res or nil
end

function getResumeMetaPath(wavPath)
    return wavPath .. ".resume.json"
end

function saveResumeMetaToDisk(stateObj)
    if not stateObj or not stateObj.partialWavPath then return end
    local ok, jsonStr = pcall(cjson.encode, stateObj)
    if ok and jsonStr then
        writeTextFile(getResumeMetaPath(stateObj.partialWavPath), jsonStr)
    end
end

function loadResumeMetaFromDisk(wavPath)
    local metaPath = getResumeMetaPath(wavPath)
    local raw = readTextFile(metaPath)
    if not raw then return nil end
    local ok, obj = pcall(cjson.decode, raw)
    if ok and type(obj) == "table" and obj.jobs and obj.nextIndex and obj.totalChunks then
        obj.partialWavPath = wavPath
        return obj
    end
    return nil
end

function deleteResumeMetaFromDisk(wavPath)
    if not wavPath then return end
    pcall(function() File(getResumeMetaPath(wavPath)).delete() end)
end

function findLatestResumeState()
    local dir = getLibraryDir()
    local files = dir.listFiles()
    if not files then return nil end
    local latestFile = nil
    local latestTime = -1
    local ok, tbl = pcall(function() return luajava.astable(files) end)
    local list = (ok and tbl) or {}
    if not ok then
        for i = 0, #files - 1 do
            pcall(function() if files[i] then table.insert(list, files[i]) end end)
        end
    end
    for _, f in ipairs(list) do
        if f and f.getName():match("%.wav$") then
            local metaFile = File(getResumeMetaPath(f.getPath()))
            if metaFile.exists() and f.lastModified() > latestTime then
                latestTime = f.lastModified()
                latestFile = f
            end
        end
    end
    if latestFile then
        return loadResumeMetaFromDisk(latestFile.getPath())
    end
    return nil
end

function formatMMSS(totalSec)
    local sec = math.max(0, math.floor(tonumber(totalSec) or 0))
    return string.format("%02d:%02d", math.floor(sec / 60), sec % 60)
end

function formatDurationReadable(totalSec)
    local sec = math.max(0, math.floor(tonumber(totalSec) or 0))
    local m = math.floor(sec / 60)
    local s = sec % 60
    return string.format("%d min %d sec", m, s)
end

function getAudioDurationSec(filePath)
    local f = File(filePath)
    if not f.exists() then return 0 end
    local len = f.length()
    if len <= 44 then return 0 end
    return math.max(0, math.floor((len - 44) / 48000))
end

function shareAudioFile(filePath)
    local f = File(filePath or "")
    if not f.exists() or f.length() <= 44 then
        showToast("Audio file not found or empty")
        return
    end
    local uri = nil
    local authority = context.getPackageName()
    local fpClasses = {
        "android.content.FileProvider",
        "androidx.core.content.FileProvider",
        "android.support.v4.content.FileProvider"
    }
    for _, clsName in ipairs(fpClasses) do
        local okCls, fpCls = pcall(luajava.bindClass, clsName)
        if okCls and fpCls then
            local okUri, resUri = pcall(function() return fpCls.getUriForFile(context, authority, f) end)
            if okUri and resUri then
                uri = resUri
                break
            end
        end
    end
    if uri == nil then
        pcall(function()
            local sm = luajava.bindClass("android.os.StrictMode")
            local builder = sm.VmPolicy.Builder()
            sm.setVmPolicy(builder.build())
            uri = Uri.fromFile(f)
        end)
    end
    if uri == nil then
        logAppError("SHARE", "Could not generate URI for sharing: " .. tostring(filePath))
        showToast("Unable to share file on this device")
        return
    end
    local okShare, errShare = pcall(function()
        local intent = Intent(Intent.ACTION_SEND)
        intent.setType("audio/wav")
        intent.putExtra(Intent.EXTRA_STREAM, uri)
        intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
        local chooser = Intent.createChooser(intent, "Share Audio")
        chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
        context.startActivity(chooser)
    end)
    if not okShare then
        logAppError("SHARE", tostring(errShare))
        showToast("Failed to open share menu")
    end
end

function copyFile(sourcePath, destPath)
    local inStream = nil
    local outStream = nil
    local success = pcall(function()
        local outFile = File(destPath)
        if not outFile.getParentFile().exists() then
            outFile.getParentFile().mkdirs()
        end
        inStream = FileInputStream(File(sourcePath))
        outStream = FileOutputStream(outFile)
        local buffer = byte[8192]
        while true do
            local len = inStream.read(buffer)
            if len == -1 then break end
            outStream.write(buffer, 0, len)
        end
        outStream.flush()
    end)
    pcall(function() if inStream then inStream.close() end end)
    pcall(function() if outStream then outStream.close() end end)
    return success
end

function saveFileToDownloads(sourcePath, fileName)
    local srcFile = File(sourcePath)
    if not srcFile.exists() or srcFile.length() <= 44 then
        return false, "Source audio file is empty or corrupt"
    end

    if Build.VERSION.SDK_INT >= 29 then
        local okMedia, mediaSaved = pcall(function()
            local resolver = context.getContentResolver()
            local values = ContentValues()
            values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
            values.put(MediaStore.MediaColumns.MIME_TYPE, "audio/wav")
            values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
            local uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
            if uri == nil then return false end
            local inStream = FileInputStream(srcFile)
            local outStream = resolver.openOutputStream(uri)
            if outStream == nil then
                inStream.close()
                return false
            end
            local buffer = byte[8192]
            while true do
                local len = inStream.read(buffer)
                if len == -1 then break end
                outStream.write(buffer, 0, len)
            end
            outStream.flush()
            inStream.close()
            outStream.close()
            return true
        end)
        if okMedia and mediaSaved then
            return true, "Saved to Downloads"
        end
    end

    local destPath = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS).getPath() .. "/" .. fileName
    local okCopy = copyFile(sourcePath, destPath)
    if okCopy then
        return true, "Saved to Downloads"
    end
    logAppError("DOWNLOAD", "Failed to save " .. tostring(fileName))
    return false, "Storage permission denied or failed to write"
end

